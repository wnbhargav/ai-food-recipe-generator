name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t recipe-generator:test .
      - name: Smoke test
        run: |
          docker run -d --name recipe -p 8000:8000 recipe-generator:test
          trap 'docker logs recipe; docker rm -f recipe' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8000/health; then break; fi
            sleep 2
          done
          curl --fail http://localhost:8000/health
          curl --fail -H 'Content-Type: application/json' -d '{"ingredients":["chickpeas","tomato"],"cuisine":"Indian","servings":2}' http://localhost:8000/api/recipes
