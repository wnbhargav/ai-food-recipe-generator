apiVersion: apps/v1
kind: Deployment
metadata:
  name: recipe-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recipe-generator
  template:
    metadata:
      labels:
        app: recipe-generator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ai-food-recipe-generator:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: RECIPE_MODE
              value: demo
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: recipe-generator
spec:
  selector:
    app: recipe-generator
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
