[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-food-recipe-generator"
version = "0.1.0"
description = "Ingredient-first recipe suggestions with local language models and retrieval"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.package-data]
pantry = ["data/*.json", "static/*"]

[tool.setuptools.packages.find]
include = ["pantry*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
